name: iOS tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ios-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  money-server-contract:
    name: Money server migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budgetmate_02c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d budgetmate_02c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify checked-in secret safety
        run: ./scripts/verify_ios_secrets.sh

      - name: Rehearse expand, mixed-client contract, and rollback restore
        shell: bash
        run: |
          set -euo pipefail
          fixture="supabase/tests/02c_legacy_fixture.sql"
          migration="supabase/migrations/20260729000100_money_server_bridge.sql"
          uuid_case_fix="supabase/migrations/20260729000200_money_server_bridge_uuid_case_fix.sql"
          contract="supabase/tests/02c_money_server_bridge_contract.sql"
          shared_data_safety_migration="supabase/migrations/20260729000300_shared_data_safety.sql"
          shared_data_safety_contract="supabase/tests/03_shared_data_safety_contract.sql"
          rollback_dump="${RUNNER_TEMP}/budgetmate-02c-legacy.dump"
          postgres_container="${{ job.services.postgres.id }}"

          psql --dbname budgetmate_02c --file "${fixture}"
          docker exec \
            -e PGPASSWORD="${PGPASSWORD}" \
            "${postgres_container}" \
            pg_dump \
              --username "${PGUSER}" \
              --format custom \
              --dbname budgetmate_02c > "${rollback_dump}"

          psql --dbname budgetmate_02c --file "${migration}"
          psql --dbname budgetmate_02c --file "${migration}"
          psql --dbname budgetmate_02c --file "${uuid_case_fix}"
          psql --dbname budgetmate_02c --file "${uuid_case_fix}"
          psql --dbname budgetmate_02c --file "${contract}"
          psql --dbname budgetmate_02c --file "${shared_data_safety_migration}"
          psql --dbname budgetmate_02c --file "${shared_data_safety_migration}"
          psql --dbname budgetmate_02c --file "${shared_data_safety_contract}"
          bash supabase/tests/03_shared_data_safety_concurrency.sh

          dropdb budgetmate_02c
          createdb budgetmate_02c
          docker exec \
            -i \
            -e PGPASSWORD="${PGPASSWORD}" \
            "${postgres_container}" \
            pg_restore \
              --username "${PGUSER}" \
              --dbname budgetmate_02c < "${rollback_dump}"
          restored="$(
            psql --dbname budgetmate_02c --tuples-only --no-align --command "
              select
                (select count(*) from public.budgets),
                (select count(*) from public.budget_transactions),
                (select count(*) from public.budget_settlements),
                (select count(*) from public.budget_settings),
                not exists (
                  select 1
                  from information_schema.columns
                  where table_schema = 'public'
                    and column_name = 'amount_minor_units'
                );
            "
          )"
          test "${restored}" = "3|2|1|3|t"

  ios:
    name: Build and test iOS
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select required Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_16.4.app/Contents/Developer"
          if [[ ! -d "${developer_dir}" ]]; then
            echo "Required Xcode 16.4 is not installed on this runner." >&2
            ls -1d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select --switch "${developer_dir}"
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          if [[ "${xcode_version}" != "16.4" ]]; then
            echo "Expected Xcode 16.4, selected ${xcode_version:-unknown}." >&2
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Validate checked-in Xcode project
        run: ruby generate_project.rb

      - name: Verify checked-in secret safety
        run: ./scripts/verify_ios_secrets.sh

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project BudgetMate.xcodeproj
          -scheme BudgetMate
          -disableAutomaticPackageResolution
          -resolvePackageDependencies

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "${simulator_id}" ]]; then
            echo "No available iPhone simulator was found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "destination=platform=iOS Simulator,id=${simulator_id}" >> "${GITHUB_OUTPUT}"
          echo "Using simulator ${simulator_id}"

      - name: Select an available iPad simulator
        id: ipad-simulator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/select_ios_simulator_uuid.sh --probe
          simulator_id="$(bash scripts/select_ios_simulator_uuid.sh iPad)"
          echo "destination=platform=iOS Simulator,id=${simulator_id}" >> "${GITHUB_OUTPUT}"
          echo "Using simulator ${simulator_id}"

      - name: Build unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project BudgetMate.xcodeproj \
            -scheme BudgetMate \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "${RUNNER_TEMP}/BudgetMateDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "${RUNNER_TEMP}/budgetmate-build.log"

      - name: Run native unit and UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project BudgetMate.xcodeproj \
            -scheme BudgetMate \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "${RUNNER_TEMP}/BudgetMateDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test \
            -only-testing:BudgetMateTests \
            -only-testing:BudgetMateUITests 2>&1 | tee "${RUNNER_TEMP}/budgetmate-tests.log"

      - name: Run iPad UI accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project BudgetMate.xcodeproj \
            -scheme BudgetMate \
            -configuration Debug \
            -destination "${{ steps.ipad-simulator.outputs.destination }}" \
            -derivedDataPath "${RUNNER_TEMP}/BudgetMateiPadDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test \
            -only-testing:BudgetMateUITests 2>&1 | tee "${RUNNER_TEMP}/budgetmate-ipad-ui-tests.log"

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budgetmate-ios-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/budgetmate-build.log
            ${{ runner.temp }}/budgetmate-tests.log
            ${{ runner.temp }}/BudgetMateDerivedData/Logs/Test/*.xcresult

  ios-release:
    name: Release archive, build, and analyze
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select required Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_16.4.app/Contents/Developer"
          if [[ ! -d "${developer_dir}" ]]; then
            echo "Required Xcode 16.4 is not installed on this runner." >&2
            exit 1
          fi
          sudo xcode-select --switch "${developer_dir}"
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          if [[ "${xcode_version}" != "16.4" ]]; then
            echo "Expected Xcode 16.4, selected ${xcode_version:-unknown}." >&2
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Validate checked-in Xcode project
        run: ruby generate_project.rb

      - name: Verify checked-in secret safety
        run: ./scripts/verify_ios_secrets.sh

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project BudgetMate.xcodeproj
          -scheme BudgetMate
          -disableAutomaticPackageResolution
          -resolvePackageDependencies

      - name: Build unsigned Release simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project BudgetMate.xcodeproj \
            -scheme BudgetMate \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/BudgetMateReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "${RUNNER_TEMP}/budgetmate-release-build.log"

      - name: Analyze Release configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project BudgetMate.xcodeproj \
            -scheme BudgetMate \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/BudgetMateReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            analyze 2>&1 | tee "${RUNNER_TEMP}/budgetmate-release-analyze.log"

      - name: Archive unsigned Release app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project BudgetMate.xcodeproj \
            -scheme BudgetMate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/BudgetMate.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee "${RUNNER_TEMP}/budgetmate-release-archive.log"

      - name: Upload Release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budgetmate-ios-release
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/budgetmate-release-build.log
            ${{ runner.temp }}/budgetmate-release-analyze.log
            ${{ runner.temp }}/budgetmate-release-archive.log
            ${{ runner.temp }}/BudgetMate.xcarchive
